<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/tubiao/forgex1.png" />
    <title>Forgex</title>
    <!--
      Bootstrap shell visual tokens（灵感来源：awesome-design-md — linear.app / x.ai）
      - Canvas：近黑层级 linear.canvas #010102 与 forgex 深蓝基调融合
      - Accent：Forgex Ant Design 主色 #1677ff + linear.primary #5e6ad2 克制叠光
      - Typography：Inter/system-ui 回落，对齐 DESIGN.md display-xs / body-sm 量级与字间距
    -->
    <style>
      :root {
        --fx-shell-canvas: #010102;
        --fx-shell-canvas-mid: #06070d;
        --fx-shell-surface: #0c0e12;
        --fx-shell-hairline: rgba(35, 37, 42, 0.55);
        --fx-shell-accent: #1677ff;
        --fx-shell-accent-linear: #5e6ad2;
        --fx-shell-accent-dusk: rgba(124, 58, 237, 0.45);
        --fx-shell-ink: #f7f8f8;
        --fx-shell-ink-muted: #9aa3b2;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--fx-shell-canvas-mid);
      }

      #app {
        width: 100%;
        height: 100%;
        opacity: 0;
      }

      .fx-bootstrap-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        isolation: isolate;
        background-color: var(--fx-shell-canvas);
        background-image:
          radial-gradient(ellipse 130% 70% at 50% -15%, rgba(22, 119, 255, 0.14), transparent 58%),
          radial-gradient(circle at 50% 42%, rgba(94, 106, 210, 0.09), transparent 46%),
          radial-gradient(circle at 72% 78%, var(--fx-shell-accent-dusk), transparent 38%),
          linear-gradient(165deg, #020305 0%, var(--fx-shell-canvas-mid) 52%, #05070c 100%);
        color: rgba(226, 232, 240, 0.92);
        opacity: 1;
        transition: opacity 280ms cubic-bezier(0.4, 0, 0.2, 1), transform 280ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .fx-bootstrap-shell::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 50%, transparent 0%, rgba(0, 0, 0, 0.42) 100%);
        z-index: 0;
      }

      .fx-bootstrap-shell__ambient {
        position: absolute;
        width: min(92vw, 520px);
        height: min(92vw, 520px);
        left: 50%;
        top: 42%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 0;
        background: radial-gradient(
          circle,
          rgba(22, 119, 255, 0.07) 0%,
          rgba(94, 106, 210, 0.04) 38%,
          transparent 68%
        );
        filter: blur(36px);
        animation: fx-bootstrap-ambient 5s ease-in-out infinite;
      }

      .fx-bootstrap-shell--hidden {
        opacity: 0;
        transform: scale(1.008);
        pointer-events: none;
      }

      .fx-bootstrap-shell__inner {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        animation: fx-bootstrap-float 2.8s ease-in-out infinite;
      }

      .fx-bootstrap-shell__ring-wrap {
        position: relative;
        width: 92px;
        height: 92px;
        filter: drop-shadow(0 0 28px rgba(22, 119, 255, 0.22)) drop-shadow(0 0 14px rgba(94, 106, 210, 0.14));
      }

      .fx-bootstrap-shell__ring {
        position: relative;
        width: 92px;
        height: 92px;
        border-radius: 50%;
        background: conic-gradient(
          from 210deg,
          transparent 0deg,
          rgba(94, 106, 210, 0.35) 55deg,
          rgba(22, 119, 255, 0.55) 130deg,
          #1677ff 245deg,
          rgba(94, 106, 210, 0.45) 310deg,
          transparent 360deg
        );
        animation: fx-bootstrap-spin 1100ms cubic-bezier(0.48, 0.12, 0.52, 0.88) infinite;
      }

      .fx-bootstrap-shell__ring::before {
        content: '';
        position: absolute;
        inset: 9px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 35%, #12151c 0%, var(--fx-shell-surface) 72%);
        box-shadow:
          inset 0 0 0 1px var(--fx-shell-hairline),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .fx-bootstrap-shell__ring::after {
        content: '';
        position: absolute;
        inset: 28px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(22, 119, 255, 0.22) 0%, rgba(22, 119, 255, 0.06) 62%, transparent 75%);
        box-shadow: 0 0 20px rgba(22, 119, 255, 0.18);
      }

      .fx-bootstrap-shell__dot {
        position: absolute;
        top: 4px;
        left: 50%;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffffff 0%, #dbeafe 55%, rgba(167, 196, 255, 0.9) 100%);
        box-shadow:
          0 0 14px rgba(255, 255, 255, 0.95),
          0 0 28px rgba(22, 119, 255, 0.55);
        transform: translateX(-50%);
      }

      .fx-bootstrap-shell__caption {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        text-align: center;
      }

      .fx-bootstrap-shell__eyebrow {
        font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(138, 143, 152, 0.85);
      }

      .fx-bootstrap-shell__text {
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 15px;
        font-weight: 500;
        line-height: 22px;
        letter-spacing: -0.015em;
        color: var(--fx-shell-ink-muted);
      }

      .fx-bootstrap-shell__text-highlight {
        background: linear-gradient(105deg, var(--fx-shell-ink-muted) 0%, var(--fx-shell-ink) 48%, var(--fx-shell-ink-muted) 100%);
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: fx-bootstrap-shimmer 2.6s ease-in-out infinite;
      }

      .fx-bootstrap-shell__rule {
        width: 44px;
        height: 1px;
        border-radius: 1px;
        background: linear-gradient(90deg, transparent, rgba(94, 106, 210, 0.45), rgba(22, 119, 255, 0.65), transparent);
        opacity: 0.85;
      }

      @keyframes fx-bootstrap-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes fx-bootstrap-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }

      @keyframes fx-bootstrap-ambient {
        0%, 100% { opacity: 0.75; transform: translate(-50%, -50%) scale(1); }
        50% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
      }

      @keyframes fx-bootstrap-shimmer {
        0%, 100% { background-position: 120% 50%; }
        50% { background-position: -20% 50%; }
      }

      @media (prefers-reduced-motion: reduce) {
        .fx-bootstrap-shell__inner,
        .fx-bootstrap-shell__ambient,
        .fx-bootstrap-shell__ring,
        .fx-bootstrap-shell__text-highlight {
          animation: none !important;
        }
        .fx-bootstrap-shell__text-highlight {
          color: var(--fx-shell-ink-muted);
          background: none;
          -webkit-background-clip: unset;
          background-clip: unset;
        }
      }
    </style>
    <script>
      (function () {
        var locale = localStorage.getItem('fx-locale') || navigator.language || 'zh-CN'
        var normalized = String(locale).toLowerCase()
        if (normalized.indexOf('zh-tw') === 0 || normalized.indexOf('zh-hk') === 0) {
          locale = 'zh-TW'
        } else if (normalized.indexOf('en') === 0) {
          locale = 'en-US'
        } else if (normalized.indexOf('ja') === 0) {
          locale = 'ja-JP'
        } else if (normalized.indexOf('ko') === 0) {
          locale = 'ko-KR'
        } else {
          locale = 'zh-CN'
        }

        var texts = {
          'zh-CN': 'Forgex正在加载您所需的任何内容，请稍等',
          'en-US': 'Forgex is loading everything you need. Please wait.',
          'zh-TW': 'Forgex正在載入您所需的任何內容，請稍候',
          'ja-JP': 'Forgex が必要なコンテンツを読み込んでいます。しばらくお待ちください。',
          'ko-KR': 'Forgex가 필요한 모든 내용을 불러오는 중입니다. 잠시만 기다려 주세요.',
        }

        document.documentElement.lang = locale
        document.documentElement.classList.add('fx-app-loading')

        window.__fxBootstrapShell = {
          hide: function () {
            var el = document.getElementById('fx-bootstrap-shell')
            if (el) {
              el.classList.add('fx-bootstrap-shell--hidden')
              window.setTimeout(function () {
                if (el && el.parentNode) {
                  el.parentNode.removeChild(el)
                }
              }, 300)
            }
            document.documentElement.classList.remove('fx-app-loading')
            document.documentElement.classList.add('fx-app-ready')
            var app = document.getElementById('app')
            if (app) {
              app.style.opacity = '1'
            }
          },
        }

        window.__fxBootstrapText = texts[locale] || texts['zh-CN']
      })()
    </script>
  </head>
  <body>
    <div id="fx-bootstrap-shell" class="fx-bootstrap-shell" aria-live="polite" role="status">
      <div class="fx-bootstrap-shell__ambient" aria-hidden="true"></div>
      <div class="fx-bootstrap-shell__inner">
        <div class="fx-bootstrap-shell__ring-wrap">
          <div class="fx-bootstrap-shell__ring" aria-hidden="true">
            <span class="fx-bootstrap-shell__dot"></span>
          </div>
        </div>
        <div class="fx-bootstrap-shell__caption">
          <span class="fx-bootstrap-shell__eyebrow">Forgex</span>
          <div class="fx-bootstrap-shell__rule" aria-hidden="true"></div>
          <div id="fx-bootstrap-shell-text" class="fx-bootstrap-shell__text fx-bootstrap-shell__text-highlight">
            Forgex正在加载您所需的任何内容，请稍等
          </div>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      (function () {
        var textEl = document.getElementById('fx-bootstrap-shell-text')
        if (textEl && window.__fxBootstrapText) {
          textEl.textContent = window.__fxBootstrapText
        }
      })()
    </script>
  </body>
</html>
